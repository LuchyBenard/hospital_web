<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-label="Illustration of an ambulance responding to an emergency call">
  <!-- ground -->
  <line x1="56" y1="222" x2="520" y2="222" stroke="#16355C" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <ellipse cx="305" cy="224" rx="215" ry="10" fill="#16355C" opacity="0.08"/>

  <!-- motion lines -->
  <line x1="34" y1="104" x2="96" y2="104" stroke="#9DB6D8" stroke-width="6" stroke-linecap="round"/>
  <line x1="20" y1="132" x2="92" y2="132" stroke="#9DB6D8" stroke-width="6" stroke-linecap="round"/>
  <line x1="44" y1="160" x2="96" y2="160" stroke="#9DB6D8" stroke-width="6" stroke-linecap="round"/>

  <!-- lightbar -->
  <rect x="248" y="54" width="76" height="16" rx="7" fill="#16355C"/>
  <rect x="248" y="54" width="38" height="16" rx="7" fill="#B91C1C"/>
  <rect x="282" y="54" width="42" height="16" rx="7" fill="#1E56A0"/>

  <!-- module body -->
  <rect x="118" y="68" width="330" height="122" rx="16" fill="#FFFFFF" stroke="#0E2038" stroke-width="3"/>
  <!-- windshield / cab front -->
  <path d="M448 68h44c8 0 14 6 15 14l7 58c1 9-6 18-15 18h-51z" fill="#DCE7F5" stroke="#0E2038" stroke-width="3"/>
  <rect x="456" y="82" width="46" height="34" rx="6" fill="#EDF3FA"/>

  <!-- crimson stripe -->
  <rect x="118" y="140" width="330" height="14" fill="#B91C1C"/>

  <!-- side trauma cross -->
  <rect x="172" y="88" width="58" height="58" rx="11" fill="#B91C1C"/>
  <path d="M192 98h18v17h17v18h-17v17h-18v-17h-17v-18h17Z" fill="#FFFFFF"/>

  <!-- side window -->
  <rect x="392" y="84" width="40" height="36" rx="7" fill="#DCE7F5" stroke="#0E2038" stroke-width="2.5"/>

  <!-- wheels -->
  <circle cx="210" cy="194" r="23" fill="#0E2038"/>
  <circle cx="210" cy="194" r="9" fill="#EDF3FA"/>
  <circle cx="404" cy="194" r="23" fill="#0E2038"/>
  <circle cx="404" cy="194" r="9" fill="#EDF3FA"/>
</svg>
