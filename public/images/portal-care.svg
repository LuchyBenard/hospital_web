<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Illustration of a medical record protected by a security shield">
  <rect width="480" height="360" rx="16" fill="#EDF3FA"/>

  <!-- floating accents -->
  <path d="M84 76h12v10h10v12H96v10H84V98H74V86h10Z" fill="#7FA6DC" opacity="0.8"/>
  <circle cx="416" cy="196" r="7" fill="#7FA6DC" opacity="0.7"/>
  <rect x="64" y="270" width="46" height="14" rx="7" fill="#FFFFFF" opacity="0.9"/>

  <!-- clipboard -->
  <rect x="120" y="66" width="204" height="242" rx="14" fill="#FFFFFF" stroke="#16355C" stroke-width="2.5"/>
  <rect x="186" y="54" width="72" height="24" rx="9" fill="#16355C"/>

  <!-- chart bars -->
  <g>
    <rect x="146" y="216" width="26" height="62" rx="4" fill="#7FA6DC"/>
    <rect x="186" y="188" width="26" height="90" rx="4" fill="#1E56A0"/>
    <rect x="226" y="202" width="26" height="76" rx="4" fill="#9DB6D8"/>
    <rect x="266" y="172" width="26" height="106" rx="4" fill="#1E56A0"/>
    <line x1="140" y1="282" x2="300" y2="282" stroke="#16355C" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- vitals pulse -->
  <polyline points="138,150 180,150 196,128 218,170 240,110 262,162 278,150 306,150"
    fill="none" stroke="#1E56A0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- security shield -->
  <path d="M330 182l56 22v44c0 36-23 59-56 71-33-12-56-35-56-71v-44z" fill="#16355C"/>
  <path d="M330 194l44 17v37c0 29-18 47-44 57-26-10-44-28-44-57v-37z" fill="#1E56A0"/>
  <polyline points="304,254 324,274 362,228" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- lock chip -->
  <path d="M388 92v-8a20 20 0 0 1 40 0v8" fill="none" stroke="#16355C" stroke-width="9" stroke-linecap="round"/>
  <rect x="374" y="92" width="68" height="52" rx="11" fill="#1E56A0"/>
  <circle cx="408" cy="112" r="6" fill="#FFFFFF"/>
  <rect x="405" y="114" width="6" height="14" rx="3" fill="#FFFFFF"/>
</svg>
